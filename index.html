<!-- ============ AGGRESSIVE NO-CACHE (kill stale SW caches) ============ -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
// Unregister any service worker and clear all caches BEFORE anything else loads.
// This breaks the "stale cached page forever" cycle on subsequent visits.
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations()
        .then(function(regs){ regs.forEach(function(r){ r.unregister(); }); })
        .catch(function(){});
    }
    if(window.caches && caches.keys){
      caches.keys().then(function(keys){
        keys.forEach(function(k){ caches.delete(k); });
      }).catch(function(){});
    }
  }catch(e){}
  console.log('%c[event] v.0.5 loaded', 'color:#d9b88a;font-weight:bold');

  // ============ visible diagnostics ============
  // If anything below this throws, we want the user to SEE it on screen.
  window.__bootStep = 'init';
  window.addEventListener('error', function(ev){
    try{
      var msg = (ev && ev.error && ev.error.stack) ? ev.error.stack : (ev.message || 'unknown error');
      var box = document.getElementById('__errBox');
      if(!box){
        box = document.createElement('div');
        box.id = '__errBox';
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#600;color:#fff;font:11px/1.5 monospace;padding:10px 14px;z-index:99999;white-space:pre-wrap;box-shadow:0 4px 16px rgba(0,0,0,.6);max-height:60vh;overflow:auto';
        (document.body || document.documentElement).appendChild(box);
      }
      box.textContent = '[JS ERROR @ step=' + window.__bootStep + ']\n' + msg;
    }catch(e){}
  });
  window.addEventListener('unhandledrejection', function(ev){
    console.error('[event] unhandled promise rejection:', ev.reason);
  });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第１回コスプレイベント『天気の子』</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23080a10'/%3E%3Cpath d='M50 28 L50 36 M14 60 Q14 36 50 32 Q86 36 86 60 M50 36 L50 88 Q50 95 44 95 Q38 95 38 90' stroke='white' fill='none' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4f6fb;
    --ink-soft:rgba(244,246,251,.72);
    --ink-faint:rgba(244,246,251,.32);
    --bg:#000;
    --warm:#d9b88a;
    --serif:'Noto Serif JP', 'Hiragino Mincho ProN', 'YuMincho', serif;
    --latin:'Cormorant Garamond', serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent;cursor:default}
  body{position:relative;user-select:none}
  button{font-family:inherit}

  /* ---------- background ---------- */
  .bg-fallback{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(60,80,110,.35), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(40,55,80,.45), transparent 60%),
      linear-gradient(180deg, #050709 0%, #0a0e15 50%, #060810 100%);
    opacity:0;transition:opacity 3.5s ease;
  }
  .bg-fallback.show{opacity:1}

  /* two crossfading bg image layers */
  .bg-image{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;z-index:1;
    opacity:0;transition:opacity 1.6s ease;
    filter:saturate(.9) contrast(1.05) brightness(.78);
    pointer-events:none;user-select:none;
  }
  .bg-image.show{opacity:1}

  /* ---------- vignette + grain ---------- */
  .vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.85) 100%)}
  .grain{
    position:fixed;inset:-50%;z-index:6;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>");
    animation:grain 6s steps(6) infinite;
  }
  @keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,1%)}80%{transform:translate(3%,-1%)}100%{transform:translate(0,0)}}

  /* ---------- rain canvas ---------- */
  #rain-canvas{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 3s ease}
  #rain-canvas.show{opacity:1}

  /* ---------- top-left credit ---------- */
  .credit{position:fixed;left:22px;top:20px;z-index:11;display:flex;flex-direction:column;gap:4px;line-height:1.4;pointer-events:none}
  .credit .c-line{display:flex;align-items:baseline;gap:8px}
  .credit .c-key{font-family:var(--latin);font-weight:300;font-size:8.5px;letter-spacing:.4em;text-transform:uppercase;color:rgba(244,246,251,.28)}
  .credit .c-val{font-family:var(--serif);font-weight:300;font-size:10px;letter-spacing:.22em;color:rgba(244,246,251,.55);text-shadow:0 0 10px rgba(0,0,0,.85)}
  @media (max-width:640px){.credit{left:14px;top:14px}.credit .c-key{font-size:7.5px}.credit .c-val{font-size:9px;letter-spacing:.18em}}

  /* ---------- title screen ---------- */
  .stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.8s ease;pointer-events:none}
  .title-wrap{
    text-align:center;color:var(--ink);
    opacity:1;transform:translateY(0);
    transition:opacity 1.8s ease, transform 1.8s ease;
  }
  .title-wrap.out{opacity:0;transform:translateY(-6px)}

  .t-overline{font-family:var(--serif);font-weight:300;font-size:clamp(11px,1.3vw,13px);letter-spacing:.18em;color:var(--ink-soft);margin-bottom:24px;opacity:0;animation:fadeUp 2.6s .3s ease forwards}
  .t-row1{font-weight:300;font-size:clamp(15px,2vw,19px);letter-spacing:.35em;color:var(--ink-soft);margin-bottom:22px;display:inline-flex;align-items:center;justify-content:center;gap:14px;opacity:0;animation:fadeUp 2.6s .8s ease forwards}
  .t-row1::before, .t-row1::after{content:'';display:inline-block;width:24px;height:1px;background:linear-gradient(to right, transparent, rgba(244,246,251,.4), transparent)}
  .t-divider{width:0;height:1px;background:var(--ink-faint);margin:0 auto 24px;animation:lineGrow 2.2s 1.2s cubic-bezier(.2,.6,.2,1) forwards}
  .t-main{font-weight:300;font-size:clamp(24px,4.8vw,48px);letter-spacing:.12em;color:var(--ink);text-shadow:0 0 28px rgba(180,200,230,.18);opacity:0;animation:fadeUp 2.8s 1.6s ease forwards}
  .t-sub{margin-top:24px;font-weight:300;font-size:clamp(11px,1.35vw,13px);letter-spacing:.42em;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;gap:14px;opacity:0;animation:fadeUp 2.6s 2.4s ease forwards}
  .t-sub::before, .t-sub::after{content:'';display:inline-block;width:22px;height:1px;background:linear-gradient(to right, transparent, rgba(244,246,251,.5), transparent)}
  .t-date{font-family:var(--latin);font-weight:300;font-size:11px;letter-spacing:.5em;color:var(--ink-faint);margin-top:42px;opacity:0;animation:fadeUp 2.6s 3s ease forwards}
  .tap-hint{position:fixed;bottom:7vh;left:0;right:0;text-align:center;z-index:11;font-family:var(--latin);font-weight:300;font-size:10px;letter-spacing:.7em;color:var(--ink-faint);text-transform:uppercase;opacity:0;animation:hintPulse 2.8s 3.6s infinite ease-in-out;pointer-events:none}
  .tap-hint.out{animation:none;opacity:0;transition:opacity .8s ease}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
  @keyframes lineGrow{to{width:120px}}
  @keyframes hintPulse{0%,100%{opacity:.18}50%{opacity:.55}}

  /* ---------- click zone (cycles bg images on tap) ---------- */
  .click-zone{position:fixed;inset:0;z-index:4;cursor:default}

  /* ---------- umbrella button (replaces 3 mission tiles) ---------- */
  .umbrella{
    position:fixed;right:9vw;top:50%;transform:translateY(-50%) translateX(14px);
    z-index:12;display:flex;flex-direction:column;align-items:center;gap:14px;
    cursor:pointer;background:transparent;border:0;padding:14px;
    opacity:0;transition:transform .8s cubic-bezier(.2,.6,.2,1), opacity 1.6s ease;
    pointer-events:none;
  }
  .umbrella.in{opacity:1;transform:translateY(-50%) translateX(0);pointer-events:auto}
  .umbrella .u-label{
    font-family:var(--serif);font-weight:300;font-size:13px;letter-spacing:.55em;
    color:var(--ink-soft);text-shadow:0 0 16px rgba(0,0,0,.75);
    transition:letter-spacing .5s ease, color .35s ease;padding-left:.55em;
  }
  .umbrella:hover{transform:translateY(-50%) translateX(8px)}
  .umbrella:hover .u-label{letter-spacing:.7em;color:#fff}
  .umbrella svg{width:96px;height:128px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(180,200,230,.18));transition:filter .35s ease;animation:umbrellaSway 7s ease-in-out infinite;transform-origin:50% 16%}
  .umbrella:hover svg{filter:drop-shadow(0 10px 22px rgba(0,0,0,.65)) drop-shadow(0 0 30px rgba(217,184,138,.3))}
  @keyframes umbrellaSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

  /* ---------- 本家 trigger (bottom-left) ---------- */
  .honke{position:fixed;left:32px;bottom:32px;z-index:12;display:flex;align-items:center;gap:10px;cursor:pointer;opacity:0;transform:translateY(6px);transition:opacity 1.6s ease, transform 1.6s ease;pointer-events:none}
  .honke.in{opacity:1;transform:translateY(0);pointer-events:auto}
  .honke .play-mark{width:22px;height:22px;border:1px solid var(--ink-faint);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:border-color .35s ease, background .35s ease}
  .honke .play-mark::before{content:'';display:block;width:0;height:0;border-left:5px solid var(--ink-soft);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;margin-left:2px;transition:border-left-color .35s ease}
  .honke .h-text{display:flex;flex-direction:column;line-height:1.2}
  .honke .h-jp{font-family:var(--serif);font-weight:300;font-size:12px;letter-spacing:.4em;color:var(--ink-soft)}
  .honke .h-en{font-family:var(--latin);font-weight:300;font-size:9px;letter-spacing:.45em;color:var(--ink-faint);text-transform:uppercase;margin-top:3px}
  .honke:hover .play-mark{border-color:var(--ink);background:rgba(244,246,251,.06)}
  .honke:hover .play-mark::before{border-left-color:var(--ink)}
  .honke:hover .h-jp{color:var(--ink)}
  .honke:hover .h-en{color:var(--ink-soft)}

  /* ---------- 本家 modal ---------- */
  .honke-modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .9s ease;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .honke-modal.in{opacity:1;pointer-events:auto}
  .lbar{position:fixed;left:0;right:0;height:0;background:#000;z-index:41;transition:height 1.1s cubic-bezier(.2,.6,.2,1);pointer-events:none}
  .lbar.top{top:0} .lbar.bot{bottom:0} .lbar.in{height:8vh}
  .h-overline{font-family:var(--latin);font-weight:300;font-size:10px;letter-spacing:.7em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:18px;opacity:0;transition:opacity 1s .5s ease}
  .h-title{font-family:var(--serif);font-weight:300;font-size:clamp(14px,1.8vw,17px);letter-spacing:.5em;color:var(--ink);margin-bottom:24px;opacity:0;transform:translateY(6px);transition:opacity 1s .6s ease, transform 1s .6s ease}
  .h-frame-wrap{position:relative;width:min(82vw, 1100px);aspect-ratio:16/9;opacity:0;transform:scale(.98);transition:opacity 1.1s .8s ease, transform 1.1s .8s ease}
  .h-corners{position:absolute;inset:-14px;pointer-events:none}
  .h-corners span{position:absolute;background:var(--ink-faint)}
  .h-corners span:nth-child(1){top:-1px;left:-1px;width:24px;height:1px}
  .h-corners span:nth-child(2){top:-1px;left:-1px;width:1px;height:24px}
  .h-corners span:nth-child(3){bottom:-1px;right:-1px;width:24px;height:1px}
  .h-corners span:nth-child(4){bottom:-1px;right:-1px;width:1px;height:24px}
  .h-frame{width:100%;height:100%;border:0;box-shadow:0 0 60px rgba(0,0,0,.7), 0 0 120px rgba(180,200,230,.05);background:#000}
  .h-meta{margin-top:22px;font-family:var(--latin);font-weight:300;font-size:10px;letter-spacing:.5em;color:var(--ink-faint);text-transform:uppercase;opacity:0;transition:opacity 1s 1s ease}
  .honke-modal.in .h-overline,.honke-modal.in .h-meta{opacity:1}
  .honke-modal.in .h-title{opacity:1;transform:translateY(0)}
  .honke-modal.in .h-frame-wrap{opacity:1;transform:scale(1)}
  .h-close{position:absolute;top:24px;right:28px;z-index:42;width:36px;height:36px;border-radius:50%;border:1px solid var(--ink-faint);background:transparent;color:var(--ink-soft);cursor:pointer;font-family:var(--latin);font-weight:300;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .35s ease;opacity:0}
  .honke-modal.in .h-close{opacity:1;transition-delay:.5s}
  .h-close:hover{border-color:var(--ink);color:var(--ink);background:rgba(244,246,251,.06)}

  /* =========================================================
     しおり (bookmark) screen — 4 cards centered
     ========================================================= */
  .shiori{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 1.2s ease;
  }
  .shiori.in{opacity:1;pointer-events:auto}
  .shiori-bg{
    position:absolute;inset:0;background:#000 center/cover no-repeat;
    background-image:url('card5.png');
    transform:scale(1.04);transition:transform 6s ease;
  }
  .shiori.in .shiori-bg{transform:scale(1)}
  .shiori-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.35) 40%, rgba(0,0,0,.7))}
  .shiori-head{position:absolute;top:6vh;left:0;right:0;text-align:center;z-index:2;color:var(--ink);opacity:0;transform:translateY(-6px);transition:opacity 1.2s .3s ease, transform 1.2s .3s ease}
  .shiori.in .shiori-head{opacity:1;transform:translateY(0)}
  .shiori-head .sh-ovr{font-family:var(--latin);font-weight:300;font-size:10px;letter-spacing:.6em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:10px}
  .shiori-head .sh-title{font-weight:300;font-size:clamp(20px,2.6vw,30px);letter-spacing:.45em;text-shadow:0 0 24px rgba(0,0,0,.7)}

  .shiori-cards{
    position:relative;z-index:2;
    display:flex;justify-content:center;align-items:center;gap:32px;
    padding:0 24px;
  }
  .shiori-card{
    position:relative;width:340px;height:520px;flex-shrink:0;
    background:#0c1018 center/cover no-repeat;
    border-radius:6px;cursor:pointer;
    box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(244,246,251,.06) inset;
    overflow:hidden;
    opacity:0;transform:translateY(20px);
    transition:transform .8s cubic-bezier(.2,.6,.2,1), opacity 1.2s ease, box-shadow .5s ease;
  }
  .shiori.in .shiori-card{opacity:1;transform:translateY(0)}
  .shiori.in .shiori-card:nth-child(1){transition-delay:.5s}
  .shiori.in .shiori-card:nth-child(2){transition-delay:.65s}
  .shiori.in .shiori-card:nth-child(3){transition-delay:.8s}
  .shiori.in .shiori-card:nth-child(4){transition-delay:.95s}
  .shiori-card:hover{transform:translateY(-8px) !important;box-shadow:0 28px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(217,184,138,.25) inset, 0 0 60px rgba(217,184,138,.12)}
  .shiori-card .sc-num{position:absolute;top:12px;left:14px;font-family:var(--latin);font-weight:300;font-size:11px;letter-spacing:.4em;color:var(--ink-faint);text-shadow:0 0 8px rgba(0,0,0,.8)}
  .shiori-card .sc-name{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-weight:300;font-size:14px;letter-spacing:.4em;color:var(--ink);text-shadow:0 0 12px rgba(0,0,0,.85)}
  .shiori-close{position:absolute;top:24px;right:28px;z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid var(--ink-faint);background:transparent;color:var(--ink-soft);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s ease}
  .shiori-close:hover{border-color:var(--ink);color:var(--ink);background:rgba(244,246,251,.06)}

  /* responsive: scale down cards on smaller screens */
  @media (max-width:1500px){.shiori-card{width:300px;height:460px}.shiori-cards{gap:24px}}
  @media (max-width:1280px){.shiori-card{width:240px;height:368px}.shiori-cards{gap:18px}}
  @media (max-width:1024px){.shiori-cards{flex-wrap:wrap;max-width:760px}.shiori-card{width:calc(50% - 12px);max-width:340px;height:auto;aspect-ratio:340/520}}
  @media (max-width:540px){.shiori-card{width:calc(50% - 8px)}.shiori-cards{gap:14px;padding:90px 16px 16px}}

  /* card click → external navigation transitions */
  .shiori-card.firing{transform:scale(.97) !important;opacity:.45;transition:transform .35s ease, opacity .55s ease}
  .shiori-card.dim{animation:cardDim .7s ease}
  @keyframes cardDim{0%,100%{opacity:1}40%{opacity:.35}}
  body.fade-out{opacity:0;transition:opacity .8s ease}

  /* misc */

  @media (max-width:640px){
    .umbrella{right:6vw}
    .umbrella svg{width:78px;height:104px}
  }
</style>
</head>
<body>

  <!-- visible version tag — if you don't see "v.0.5" in the corner, the browser is serving a cached old file -->
  <div style="position:fixed;top:6px;right:8px;z-index:9999;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:10px;line-height:1;color:rgba(255,255,255,0.5);letter-spacing:.25em;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.8)">v.0.5</div>

  <!-- backgrounds -->
  <div class="bg-fallback" id="bgFallback"></div>
  <img class="bg-image" id="bgImageA" src="rain.png" alt="" draggable="false">
  <img class="bg-image" id="bgImageB" src="" alt="" draggable="false">

  <!-- click zone behind UI for cycling backgrounds -->
  <div class="click-zone" id="clickZone"></div>

  <!-- rain canvas overlay -->
  <canvas id="rain-canvas"></canvas>

  <div class="grain"></div>
  <div class="vignette"></div>

  <!-- top-left credit -->
  <div class="credit" aria-hidden="true">
    <div class="c-line"><span class="c-key">image</span><span class="c-val">背景画像元『gogh』</span></div>
    <div class="c-line"><span class="c-key">work</span><span class="c-val">作品元『天気の子』</span></div>
  </div>

  <!-- title screen -->
  <div class="stage" id="stage">
    <div class="title-wrap" id="titleWrap">
      <div class="t-overline">映画作品のファンによる非公式コスプレ交流会</div>
      <div class="t-row1">『 天 気 の 子 』</div>
      <div class="t-divider"></div>
      <div class="t-main">第 １ 回 コ ス プ レ イ ベ ン ト</div>
      <div class="t-sub">非公式ファンイベント　·　非営利</div>
      <div class="t-date">A R A I S H I I  ·  ２０２６</div>
    </div>
  </div>
  <div class="tap-hint" id="tapHint">tap to begin</div>

  <!-- umbrella button (replaces the 3 mission tiles) -->
  <button class="umbrella" id="umbrellaBtn" aria-label="しおりを開く">
    <svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
      <g stroke="white" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="60" y1="22" x2="60" y2="34"/>
        <circle cx="60" cy="22" r="2" fill="white" stroke="none"/>
        <path d="M14 70 Q14 38 60 32 Q106 38 106 70"/>
        <path d="M14 70 Q24 78 32 72 Q42 80 50 72 Q60 80 70 72 Q78 80 88 72 Q96 78 106 70"/>
        <line x1="60" y1="32" x2="22" y2="73" opacity=".75"/>
        <line x1="60" y1="32" x2="42" y2="76" opacity=".75"/>
        <line x1="60" y1="32" x2="60" y2="76" opacity=".75"/>
        <line x1="60" y1="32" x2="78" y2="76" opacity=".75"/>
        <line x1="60" y1="32" x2="98" y2="73" opacity=".75"/>
        <line x1="60" y1="34" x2="60" y2="135"/>
        <path d="M60 135 Q60 148 50 148 Q42 148 42 138"/>
      </g>
    </svg>
    <div class="u-label">し お り</div>
  </button>

  <!-- 本家 trigger -->
  <div class="honke" id="honkeBtn" role="button" aria-label="本家映像を見る">
    <div class="play-mark"></div>
    <div class="h-text">
      <div class="h-jp">本　家</div>
      <div class="h-en">play official</div>
    </div>
  </div>

  <div class="lbar top" id="lbarTop"></div>
  <div class="lbar bot" id="lbarBot"></div>

  <div class="honke-modal" id="honkeModal">
    <button class="h-close" id="honkeClose" aria-label="閉じる">×</button>
    <div class="h-overline">— 本 家 映 像 —</div>
    <div class="h-title">『 天 気 の 子 』 予 告</div>
    <div class="h-frame-wrap">
      <div class="h-corners"><span></span><span></span><span></span><span></span></div>
      <iframe id="honkeIframe" class="h-frame" src="" title="本家映像" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <div class="h-meta">© toho · official trailer</div>
  </div>

  <!-- ============== しおり ============== -->
  <div class="shiori" id="shiori">
    <div class="shiori-bg"></div>
    <button class="shiori-close" id="shioriClose" aria-label="閉じる">×</button>
    <div class="shiori-head">
      <div class="sh-ovr">— program —</div>
      <div class="sh-title">し　お　り</div>
    </div>
    <div class="shiori-cards">
      <div class="shiori-card" data-card="1" data-href="https://zzcafe2800.github.io/chahan/" style="background-image:url('card1.png')">
        <div class="sc-num">01</div>
        <div class="sc-name">３ 人 で チ ャ ー ハ ン 作 り</div>
      </div>
      <div class="shiori-card" data-card="2" data-href="" style="background-image:url('card2.png')">
        <div class="sc-num">02</div>
        <div class="sc-name">天 気 探 し</div>
      </div>
      <div class="shiori-card" data-card="3" data-href="" style="background-image:url('card3.png')">
        <div class="sc-num">03</div>
        <div class="sc-name">参 考 フ ォ ト 集</div>
      </div>
      <div class="shiori-card" data-card="4" data-href="" style="background-image:url('card4.png')">
        <div class="sc-num">04</div>
        <div class="sc-name">そ の 他</div>
      </div>
    </div>
  </div>

  <!-- audio -->
  <audio id="rainAudio" loop preload="auto"><source src="rain.mp3" type="audio/mpeg"></audio>
  <audio id="clickAudio" preload="auto"><source src="rain1.mp3" type="audio/mpeg"></audio>

  <!-- hidden YouTube audio host -->
  <div id="yt-audio-host" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none"><div id="yt-audio-player"></div></div>

<!-- ============================== JS ============================== -->
<script>
"use strict";
(function(){
  window.__bootStep = 'iife-start';
  try {
  // ---------- helpers ----------
  const $ = (id)=>document.getElementById(id);
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  function uuid(){ return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  let myId;
  try{
    myId = localStorage.getItem('chahan_pid');
    if(!myId){ myId = uuid(); localStorage.setItem('chahan_pid', myId); }
  }catch(e){ myId = uuid(); }

  console.log('[event] booted, myId =', myId);

  // ---------- top-level state ----------
  let topState = 'loading'; // loading | title | starting | home | shiori

  // ---------- elements ----------
  window.__bootStep = 'getting-elements';
  const titleWrap = $('titleWrap'), tapHint = $('tapHint');
  const bgFallback = $('bgFallback');
  const bgA = $('bgImageA'), bgB = $('bgImageB');
  const rainAudio = $('rainAudio'), clickAudio = $('clickAudio');
  const umbrellaBtn = $('umbrellaBtn');
  const honkeBtn = $('honkeBtn'), honkeModal = $('honkeModal'), honkeClose = $('honkeClose'), honkeIframe = $('honkeIframe');
  const lbarTop = $('lbarTop'), lbarBot = $('lbarBot');
  const shiori = $('shiori'), shioriClose = $('shioriClose');

  // null-check critical elements; if any are missing, log them visibly
  var missingEls = [];
  ['titleWrap','tapHint','bgFallback','bgImageA','bgImageB','rainAudio','clickAudio','umbrellaBtn','honkeBtn','honkeModal','honkeClose','honkeIframe','lbarTop','lbarBot','shiori','shioriClose'].forEach(function(id){
    if(!document.getElementById(id)) missingEls.push(id);
  });
  if(missingEls.length){
    console.error('[event] MISSING ELEMENTS:', missingEls);
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#600;color:#fff;font:11px/1.5 monospace;padding:10px;z-index:99999';
    box.textContent = 'MISSING ELEMENTS: ' + missingEls.join(', ');
    (document.body || document.documentElement).appendChild(box);
  }

  // title is now visible by CSS default; just enable tap-to-start after a brief beat
  // (use plain setTimeout so we don't depend on the 'load' event firing — which can
  // be delayed indefinitely by missing/slow image assets)
  setTimeout(()=>{
    if(topState === 'loading'){
      topState = 'title';
      console.log('[event] title ready, awaiting tap');
    }
  }, 700);

  // ---------- bg image cycling ----------
  window.__bootStep = 'bg-cycle-setup';
  const bgImages = ['rain.png','rain1.png','rain2.png','rain3.png','rain4.png','rain5.png'];
  let bgIdx = 0;
  let activeIsA = true;
  function cycleBg(){
    bgIdx = (bgIdx + 1) % bgImages.length;
    const next = bgImages[bgIdx];
    const incoming = activeIsA ? bgB : bgA;
    const outgoing = activeIsA ? bgA : bgB;
    const tmp = new Image();
    tmp.onload = ()=>{
      incoming.src = next;
      requestAnimationFrame(()=>{
        incoming.classList.add('show');
        outgoing.classList.remove('show');
        activeIsA = !activeIsA;
      });
    };
    tmp.onerror = ()=>{ console.warn('[bg] missing:', next); };
    tmp.src = next;
  }
  $('clickZone').addEventListener('click', ()=>{
    if(topState === 'home') cycleBg();
  });

  // ---------- YouTube IFrame audio ----------
  window.__bootStep = 'youtube-setup';
  let ytPlayer = null, ytReady = false;
  const YT_AUDIO_ID = 'YAXTn0E-Zgo';
  (function loadYT(){
    if(window.YT && window.YT.Player){ initYT(); return; }
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = ()=>console.warn('[yt] iframe API blocked, audio disabled');
    document.head.appendChild(tag);
  })();
  window.onYouTubeIframeAPIReady = ()=>initYT();
  function initYT(){
    if(ytPlayer || !window.YT) return;
    try{
      ytPlayer = new YT.Player('yt-audio-player', {
        height:'1', width:'1', videoId: YT_AUDIO_ID,
        playerVars:{ autoplay:0, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, playsinline:1, rel:0, loop:1, playlist:YT_AUDIO_ID },
        events:{
          'onReady': ()=>{ ytReady = true; try{ ytPlayer.setVolume(0); }catch(e){} },
          'onStateChange': (e)=>{ if(e.data === YT.PlayerState.ENDED){ try{ ytPlayer.seekTo(0); ytPlayer.playVideo(); }catch(err){} } }
        }
      });
    }catch(e){ console.warn('[yt] init failed:', e); }
  }
  function ytFadeVolume(target, duration){
    if(!ytPlayer || !ytReady) return;
    const t0 = performance.now();
    let from = 0; try{ from = ytPlayer.getVolume() || 0; }catch(e){}
    function step(now){
      const t = Math.min(1,(now-t0)/duration);
      const e = t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      try{ ytPlayer.setVolume(from + (target - from) * e); }catch(err){}
      if(t<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function fadeAudioVolume(audio, target, duration){
    const t0 = performance.now();
    const from = audio.volume || 0;
    function step(now){
      const t = Math.min(1,(now-t0)/duration);
      const e = t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      audio.volume = Math.max(0, Math.min(1, from + (target - from) * e));
      if(t<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- start (first tap anywhere) ----------
  window.__bootStep = 'start-fn-setup';
  let started = false;
  function start(){
    if(started) return;
    if(topState !== 'title'){ console.log('[event] start ignored, topState=', topState); return; }
    started = true; topState = 'starting';
    console.log('[event] starting experience');

    titleWrap.classList.remove('in');
    titleWrap.classList.add('out');
    tapHint.classList.add('out');

    bgA.classList.add('show');
    bgFallback.classList.add('show');
    $('rain-canvas').classList.add('show');
    rainActive = true;

    try{
      rainAudio.volume = 0;
      const pr = rainAudio.play();
      if(pr && pr.then) pr.then(()=>fadeAudioVolume(rainAudio, 0.55, 5000)).catch(()=>{});
    }catch(e){}

    const tryYT = (n=0)=>{
      if(!ytPlayer || !ytReady){
        if(n < 30) setTimeout(()=>tryYT(n+1), 300);
        return;
      }
      try{ ytPlayer.setVolume(0); ytPlayer.playVideo(); setTimeout(()=>ytFadeVolume(55,5000), 400); }catch(e){}
    };
    tryYT();

    setTimeout(()=>{
      umbrellaBtn.classList.add('in');
      honkeBtn.classList.add('in');
      topState = 'home';
      console.log('[event] home ready, umbrella + honke active');
    }, 2200);
  }
  ['click','touchstart','keydown'].forEach(ev=>window.addEventListener(ev, start, {passive:true}));

  // ---------- ambient audio control ----------
  function pauseAmbient(){
    try{ if(!rainAudio.paused) rainAudio.pause(); }catch(e){}
    if(ytPlayer && ytReady){ try{ if(ytPlayer.getPlayerState() === 1) ytPlayer.pauseVideo(); }catch(e){} }
  }
  function resumeAmbient(){
    try{ const p = rainAudio.play(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
    if(ytPlayer && ytReady){ try{ ytPlayer.playVideo(); }catch(e){} }
  }

  // ---------- 本家 modal ----------
  honkeBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(topState !== 'home') return;
    pauseAmbient();
    lbarTop.classList.add('in'); lbarBot.classList.add('in');
    honkeIframe.src = `https://www.youtube.com/embed/VGksHFs04Rc?start=3&autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    honkeModal.classList.add('in');
  });
  function closeHonke(){
    honkeModal.classList.remove('in');
    lbarTop.classList.remove('in'); lbarBot.classList.remove('in');
    setTimeout(()=>{ honkeIframe.src = ''; }, 700);
    if(topState === 'home') resumeAmbient();
  }
  honkeClose.addEventListener('click', e=>{ e.stopPropagation(); closeHonke(); });
  honkeModal.addEventListener('click', e=>{ if(e.target === honkeModal) closeHonke(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && honkeModal.classList.contains('in')) closeHonke(); });

  // ---------- umbrella → しおり ----------
  window.__bootStep = 'umbrella-shiori-setup';
  umbrellaBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    console.log('[event] umbrella clicked, topState=', topState);
    if(topState !== 'home') return;
    topState = 'shiori';
    pauseAmbient();
    shiori.classList.add('in');
  });
  shioriClose.addEventListener('click', e=>{ e.stopPropagation(); closeShiori(); });
  function closeShiori(){
    shiori.classList.remove('in');
    topState = 'home';
    resumeAmbient();
  }
  document.querySelectorAll('.shiori-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const url = card.dataset.href;
      if(!url){
        // soft "not yet" feedback for cards still being built
        card.classList.add('dim');
        setTimeout(()=>card.classList.remove('dim'), 700);
        return;
      }
      // brief click animation, then fade page out, then navigate
      card.classList.add('firing');
      try{
        clickAudio.currentTime = 0;
        clickAudio.volume = 0.85;
        const p = clickAudio.play(); if(p && p.catch) p.catch(()=>{});
      }catch(e){}
      // fully stop ambient before leaving so it doesn't keep playing on the new page's history entry
      try{ rainAudio.pause(); }catch(e){}
      if(ytPlayer && ytReady){ try{ ytPlayer.pauseVideo(); }catch(e){} }
      setTimeout(()=>{ document.body.classList.add('fade-out'); }, 250);
      setTimeout(()=>{ window.location.href = url; }, 1050);
    });
  });

  // ---------- rain canvas ----------
  const canvas = $('rain-canvas');
  const ctx = canvas.getContext('2d');
  let W=0,H=0,dpr=1, rainActive=false, drops=[];
  const LAYERS = [
    { share:.30, sMin: 9,  sMax: 15, lMin: 5,  lMax: 13, oMin:.05, oMax:.12, wMin:.5, wMax:.7, slMin:-.4, slMax:-.9 },
    { share:.40, sMin: 20, sMax: 34, lMin: 14, lMax: 30, oMin:.10, oMax:.22, wMin:.6, wMax:.9, slMin:-.7, slMax:-1.4 },
    { share:.30, sMin: 42, sMax: 80, lMin: 30, lMax: 70, oMin:.22, oMax:.45, wMin:.9, wMax:1.3, slMin:-1.0, slMax:-2.0 },
  ];
  function rand(a,b){return a+Math.random()*(b-a)}
  function makeDrop(L){return{x:Math.random()*W,y:Math.random()*H-H,len:rand(L.lMin,L.lMax),speed:rand(L.sMin,L.sMax),opacity:rand(L.oMin,L.oMax),width:rand(L.wMin,L.wMax),slant:rand(L.slMin,L.slMax),layer:L}}
  function initDrops(){drops=[];const baseCount=Math.min(420,Math.max(150,Math.floor(W*H/4800)));LAYERS.forEach(L=>{const n=Math.floor(baseCount*L.share);for(let i=0;i<n;i++) drops.push(makeDrop(L))})}
  function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);initDrops()}
  function tick(){
    if(!rainActive){requestAnimationFrame(tick);return}
    ctx.clearRect(0,0,W,H);
    ctx.lineCap='round';
    for(let i=0;i<drops.length;i++){
      const d=drops[i];
      ctx.lineWidth=d.width;
      const x2=d.x+d.slant, y2=d.y+d.len;
      const g = ctx.createLinearGradient(d.x,d.y,x2,y2);
      g.addColorStop(0,'rgba(225,238,255,0)');
      g.addColorStop(1,`rgba(230,240,255,${d.opacity})`);
      ctx.strokeStyle=g;
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(x2,y2); ctx.stroke();
      d.x += d.slant*.35; d.y += d.speed;
      if(d.y > H){d.y=-d.len-rand(0,100);d.x=Math.random()*W;d.len=rand(d.layer.lMin,d.layer.lMax);d.speed=rand(d.layer.sMin,d.layer.sMax);d.opacity=rand(d.layer.oMin,d.layer.oMax);d.slant=rand(d.layer.slMin,d.layer.slMax)}
    }
    requestAnimationFrame(tick);
  }
  let resizeT=null;
  window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(resize,120)});
  resize();
  requestAnimationFrame(tick);
  bgA.addEventListener('error',()=>{ bgA.style.display='none'; });


  console.log('[event] script ready, awaiting load event');
  window.__bootStep = 'iife-complete';
  } catch(err){
    window.__bootStep = 'iife-crashed';
    console.error('[event] IIFE crashed at step=' + window.__bootStep + ':', err);
    var box = document.getElementById('__errBox');
    if(!box){
      box = document.createElement('div');
      box.id = '__errBox';
      box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#600;color:#fff;font:11px/1.5 monospace;padding:10px 14px;z-index:99999;white-space:pre-wrap;box-shadow:0 4px 16px rgba(0,0,0,.6);max-height:60vh;overflow:auto';
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent = '[IIFE CRASH @ ' + window.__bootStep + ']\n' + (err && err.stack ? err.stack : String(err));
  }
})();
</script>
