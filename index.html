<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第１回コスプレイベント『天気の子』</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4f6fb;
    --ink-soft:rgba(244,246,251,.72);
    --ink-faint:rgba(244,246,251,.32);
    --bg:#000;
    --warm:#d9b88a;
    --serif:'Noto Serif JP', 'Hiragino Mincho ProN', 'YuMincho', serif;
    --latin:'Cormorant Garamond', serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent;cursor:default}
  body{position:relative;user-select:none}

  /* ---------- background ---------- */
  .bg-fallback{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(60,80,110,.35), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(40,55,80,.45), transparent 60%),
      linear-gradient(180deg, #050709 0%, #0a0e15 50%, #060810 100%);
    opacity:0;transition:opacity 3.5s ease;
  }
  .bg-fallback.show{opacity:1}

  .bg-video{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;z-index:1;
    opacity:0;transition:opacity 3.5s ease;
    filter:saturate(.85) contrast(1.05) brightness(.55);
    pointer-events:none;
  }
  .bg-video.show{opacity:1}

  /* ---------- vignette + grain ---------- */
  .vignette{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.85) 100%);
  }
  .grain{
    position:fixed;inset:-50%;z-index:6;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>");
    animation:grain 6s steps(6) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)}
    40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,1%)}
    80%{transform:translate(3%,-1%)} 100%{transform:translate(0,0)}
  }

  /* ---------- rain canvas ---------- */
  #rain-canvas{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 3s ease}
  #rain-canvas.show{opacity:1}

  /* ---------- top-left credit (always visible) ---------- */
  .credit{
    position:fixed;left:22px;top:20px;z-index:11;
    display:flex;flex-direction:column;gap:4px;line-height:1.4;
    pointer-events:none;
  }
  .credit .c-line{display:flex;align-items:baseline;gap:8px}
  .credit .c-key{
    font-family:var(--latin);font-weight:300;font-size:8.5px;letter-spacing:.4em;
    text-transform:uppercase;color:rgba(244,246,251,.28);
  }
  .credit .c-val{
    font-family:var(--serif);font-weight:300;font-size:10px;letter-spacing:.22em;
    color:rgba(244,246,251,.55);
    text-shadow:0 0 10px rgba(0,0,0,.85);
  }
  @media (max-width:640px){
    .credit{left:14px;top:14px}
    .credit .c-key{font-size:7.5px}
    .credit .c-val{font-size:9px;letter-spacing:.18em}
  }

  /* ---------- title screen ---------- */
  .stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.8s ease}

  .title-wrap{
    text-align:center;color:var(--ink);
    opacity:0;transform:translateY(8px);
    transition:opacity 2.4s cubic-bezier(.2,.6,.2,1), transform 2.4s cubic-bezier(.2,.6,.2,1);
  }
  .title-wrap.in{opacity:1;transform:translateY(0)}
  .title-wrap.out{opacity:0;transform:translateY(-6px);transition:opacity 1.6s ease, transform 1.6s ease}

  .t-overline{
    font-family:var(--latin);font-weight:300;font-size:11px;letter-spacing:.55em;
    color:var(--ink-faint);text-transform:uppercase;margin-bottom:28px;
    opacity:0;animation:fadeUp 2.6s .3s ease forwards;
  }
  .t-row1{
    font-weight:300;font-size:clamp(13px,2.2vw,17px);letter-spacing:.4em;
    color:var(--ink-soft);margin-bottom:22px;
    opacity:0;animation:fadeUp 2.6s .8s ease forwards;
  }
  .t-divider{
    width:0;height:1px;background:var(--ink-faint);margin:0 auto 26px;
    animation:lineGrow 2.2s 1.2s cubic-bezier(.2,.6,.2,1) forwards;
  }
  .t-main{
    font-weight:400;font-size:clamp(34px,6vw,64px);letter-spacing:.18em;
    color:var(--ink);text-shadow:0 0 28px rgba(180,200,230,.18);
    opacity:0;animation:fadeUp 2.8s 1.5s ease forwards;
  }
  .t-sub{
    margin-top:22px;font-weight:300;font-size:clamp(13px,1.6vw,16px);letter-spacing:.5em;
    color:var(--ink-soft);
    display:inline-flex;align-items:center;justify-content:center;gap:14px;
    opacity:0;animation:fadeUp 2.6s 2.2s ease forwards;
  }
  .t-sub::before, .t-sub::after{
    content:'';display:inline-block;width:22px;height:1px;
    background:linear-gradient(to right, transparent, rgba(244,246,251,.5), transparent);
  }
  .t-date{
    font-family:var(--latin);font-weight:300;font-size:11px;letter-spacing:.5em;
    color:var(--ink-faint);margin-top:46px;
    opacity:0;animation:fadeUp 2.6s 2.8s ease forwards;
  }

  .tap-hint{
    position:fixed;bottom:7vh;left:0;right:0;text-align:center;z-index:11;
    font-family:var(--latin);font-weight:300;font-size:10px;letter-spacing:.7em;
    color:var(--ink-faint);text-transform:uppercase;
    opacity:0;animation:hintPulse 2.8s 3.6s infinite ease-in-out;
  }
  .tap-hint.out{animation:none;opacity:0;transition:opacity .8s ease}

  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
  @keyframes lineGrow{to{width:120px}}
  @keyframes hintPulse{
    0%,100%{opacity:.18}
    50%{opacity:.55}
  }

  /* ---------- menu (right side) ---------- */
  .menu{
    position:fixed;right:7vw;top:50%;transform:translateY(-50%);
    z-index:12;display:flex;flex-direction:column;gap:6vh;
    opacity:0;transition:opacity 2s ease;pointer-events:none;
  }
  .menu.in{opacity:1;pointer-events:auto}

  .mission{
    position:relative;display:flex;flex-direction:column;align-items:center;
    cursor:pointer;
    opacity:0;transform:translateX(14px);
    transition:transform .7s cubic-bezier(.2,.6,.2,1), opacity 1.4s ease;
  }
  .menu.in .mission{opacity:1;transform:translateX(0)}
  .menu.in .mission:nth-child(1){transition-delay:.2s}
  .menu.in .mission:nth-child(2){transition-delay:.55s}
  .menu.in .mission:nth-child(3){transition-delay:.9s}

  /* hover: only the hovered mission shifts right */
  .menu.in .mission:hover{transform:translateX(10px)}

  .mission .label{
    font-family:var(--serif);font-weight:300;font-size:15px;letter-spacing:.55em;
    color:var(--ink);
    text-shadow:0 0 18px rgba(0,0,0,.7), 0 0 32px rgba(160,180,210,.15);
    margin-bottom:14px;padding-left:.55em;
    transition:letter-spacing .6s ease, color .4s ease, text-shadow .4s ease;
  }
  .mission:hover .label{
    letter-spacing:.7em;
    color:#fff;
    text-shadow:0 0 22px rgba(0,0,0,.7), 0 0 28px rgba(217,184,138,.45);
  }

  .teru-frame{
    position:relative;width:74px;height:104px;
    display:flex;align-items:center;justify-content:center;
  }
  .teru-img{
    width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(180,200,230,.12));
    transition:filter .4s ease;
    transform-origin:50% 8%;
  }
  /* independent ambient breathing — different timings per teru, only the hovered one sways more */
  .mission[data-key="chahan"] .teru-img{animation:breathe1 9s ease-in-out infinite}
  .mission[data-key="tenki"]  .teru-img{animation:breathe2 11s -3.4s ease-in-out infinite}
  .mission[data-key="photo"]  .teru-img{animation:breathe3 8.5s -6.1s ease-in-out infinite}

  .mission:hover .teru-img{
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.6)) drop-shadow(0 0 28px rgba(217,184,138,.35));
    animation:swayHover 3s ease-in-out infinite;
  }

  @keyframes breathe1{
    0%,100%{transform:rotate(-.4deg) translateY(0)}
    50%{transform:rotate(.4deg) translateY(-1.5px)}
  }
  @keyframes breathe2{
    0%,100%{transform:rotate(.5deg) translateY(-1px)}
    50%{transform:rotate(-.5deg) translateY(1px)}
  }
  @keyframes breathe3{
    0%,100%{transform:rotate(-.3deg) translateY(1px)}
    50%{transform:rotate(.3deg) translateY(-2px)}
  }
  @keyframes swayHover{
    0%,100%{transform:rotate(-1.4deg) translateY(0)}
    50%{transform:rotate(1.4deg) translateY(-3px)}
  }

  /* string above teru */
  .teru-string{
    position:absolute;top:-22px;left:50%;width:1px;height:22px;
    background:linear-gradient(to bottom, transparent, rgba(244,246,251,.25));
  }

  /* ripple */
  .ripple{
    position:absolute;left:50%;top:50%;width:0;height:0;
    border:1.5px solid rgba(244,246,251,.85);border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;
    animation:rippleExpand 1.6s cubic-bezier(.2,.6,.2,1) forwards;
  }
  .ripple.r2{animation-delay:.18s;border-color:rgba(217,184,138,.55)}
  .ripple.r3{animation-delay:.36s;border-color:rgba(244,246,251,.4)}
  @keyframes rippleExpand{
    0%{width:0;height:0;opacity:.95;border-width:2px}
    60%{opacity:.5}
    100%{width:380px;height:380px;opacity:0;border-width:.4px}
  }

  /* selected state */
  .mission.firing .teru-img{transform:scale(.96);transition:transform .3s ease}
  .mission.firing .label{color:#fff;letter-spacing:.7em}

  /* ---------- 本家 trigger (bottom-left) ---------- */
  .honke{
    position:fixed;left:32px;bottom:32px;z-index:12;
    display:flex;align-items:center;gap:10px;
    cursor:pointer;
    opacity:0;transform:translateY(6px);
    transition:opacity 1.6s ease, transform 1.6s ease;
    pointer-events:none;
  }
  .honke.in{opacity:1;transform:translateY(0);pointer-events:auto}
  .honke .play-mark{
    width:22px;height:22px;border:1px solid var(--ink-faint);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .35s ease, background .35s ease;
  }
  .honke .play-mark::before{
    content:'';display:block;width:0;height:0;
    border-left:5px solid var(--ink-soft);
    border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
    margin-left:2px;transition:border-left-color .35s ease;
  }
  .honke .h-text{display:flex;flex-direction:column;line-height:1.2}
  .honke .h-jp{
    font-family:var(--serif);font-weight:300;font-size:12px;letter-spacing:.4em;
    color:var(--ink-soft);
  }
  .honke .h-en{
    font-family:var(--latin);font-weight:300;font-size:9px;letter-spacing:.45em;
    color:var(--ink-faint);text-transform:uppercase;margin-top:3px;
  }
  .honke:hover .play-mark{border-color:var(--ink);background:rgba(244,246,251,.06)}
  .honke:hover .play-mark::before{border-left-color:var(--ink)}
  .honke:hover .h-jp{color:var(--ink)}
  .honke:hover .h-en{color:var(--ink-soft)}

  /* ---------- 本家 modal (cinematic letterbox) ---------- */
  .honke-modal{
    position:fixed;inset:0;z-index:40;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;
    transition:opacity .9s ease;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  .honke-modal.in{opacity:1;pointer-events:auto}

  /* letterbox bars */
  .lbar{position:fixed;left:0;right:0;height:0;background:#000;z-index:41;transition:height 1.1s cubic-bezier(.2,.6,.2,1);pointer-events:none}
  .lbar.top{top:0}
  .lbar.bot{bottom:0}
  .lbar.in{height:8vh}

  .h-overline{
    font-family:var(--latin);font-weight:300;font-size:10px;letter-spacing:.7em;
    color:var(--ink-faint);text-transform:uppercase;margin-bottom:18px;
    opacity:0;transition:opacity 1s .5s ease;
  }
  .h-title{
    font-family:var(--serif);font-weight:300;font-size:clamp(14px,1.8vw,17px);
    letter-spacing:.5em;color:var(--ink);margin-bottom:24px;
    opacity:0;transform:translateY(6px);
    transition:opacity 1s .6s ease, transform 1s .6s ease;
  }
  .h-frame-wrap{
    position:relative;width:min(82vw, 1100px);aspect-ratio:16/9;
    opacity:0;transform:scale(.98);
    transition:opacity 1.1s .8s ease, transform 1.1s .8s ease;
  }
  .h-corners{position:absolute;inset:-14px;pointer-events:none}
  .h-corners span{position:absolute;background:var(--ink-faint)}
  .h-corners span:nth-child(1){top:-1px;left:-1px;width:24px;height:1px}
  .h-corners span:nth-child(2){top:-1px;left:-1px;width:1px;height:24px}
  .h-corners span:nth-child(3){bottom:-1px;right:-1px;width:24px;height:1px}
  .h-corners span:nth-child(4){bottom:-1px;right:-1px;width:1px;height:24px}

  .h-frame{
    width:100%;height:100%;border:0;
    box-shadow:0 0 60px rgba(0,0,0,.7), 0 0 120px rgba(180,200,230,.05);
    background:#000;
  }

  .h-meta{
    margin-top:22px;font-family:var(--latin);font-weight:300;font-size:10px;
    letter-spacing:.5em;color:var(--ink-faint);text-transform:uppercase;
    opacity:0;transition:opacity 1s 1s ease;
  }

  .honke-modal.in .h-overline,
  .honke-modal.in .h-meta{opacity:1}
  .honke-modal.in .h-title{opacity:1;transform:translateY(0)}
  .honke-modal.in .h-frame-wrap{opacity:1;transform:scale(1)}

  .h-close{
    position:absolute;top:24px;right:28px;z-index:42;
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--ink-faint);background:transparent;color:var(--ink-soft);
    cursor:pointer;font-family:var(--latin);font-weight:300;font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:all .35s ease;opacity:0;
  }
  .honke-modal.in .h-close{opacity:1;transition-delay:.5s}
  .h-close:hover{border-color:var(--ink);color:var(--ink);background:rgba(244,246,251,.06)}

  /* ---------- mission destination scene ---------- */
  .scene{
    position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.0);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    pointer-events:none;opacity:0;transition:opacity 1.6s ease, background 1.6s ease;
  }
  .scene.in{opacity:1;pointer-events:auto;background:rgba(0,0,0,.78)}
  .scene-name{
    font-family:var(--serif);font-weight:300;font-size:clamp(32px,4.5vw,52px);
    letter-spacing:.4em;color:var(--ink);
    text-shadow:0 0 30px rgba(180,200,230,.2);
    transform:translateY(10px);opacity:0;transition:all 1.6s .3s ease;
    text-align:center;padding:0 24px;
  }
  .scene.in .scene-name{transform:translateY(0);opacity:1}
  .scene-mark{
    font-family:var(--latin);font-weight:300;font-size:10px;letter-spacing:.6em;
    color:var(--ink-faint);text-transform:uppercase;margin-top:24px;
    opacity:0;transition:opacity 1.6s .9s ease;
  }
  .scene.in .scene-mark{opacity:1}
  .scene-back{
    position:absolute;top:32px;left:32px;font-family:var(--latin);font-weight:300;
    font-size:11px;letter-spacing:.4em;color:var(--ink-faint);
    text-transform:uppercase;cursor:pointer;padding:8px 12px;
    opacity:0;transition:opacity 1.6s 1.1s ease, color .3s ease;
  }
  .scene.in .scene-back{opacity:1}
  .scene-back:hover{color:var(--ink)}

  /* hidden YouTube audio iframe */
  #yt-audio-host{
    position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;
    opacity:0;pointer-events:none;
  }

  /* mobile tweaks */
  @media (max-width:640px){
    .menu{right:6vw;gap:5vh}
    .teru-frame{width:62px;height:88px}
    .mission .label{font-size:12px;letter-spacing:.45em}
    .honke{left:18px;bottom:18px}
    .honke .h-jp{font-size:11px}
    .h-frame-wrap{width:92vw}
    .h-close{top:14px;right:14px}
  }
</style>
</head>
<body>

  <!-- gradient fallback first so the optional rain.mp4 paints on top -->
  <div class="bg-fallback" id="bgFallback"></div>
  <video class="bg-video" id="bgVideo" muted loop playsinline preload="auto">
    <source src="rain.mp4" type="video/mp4">
  </video>

  <!-- realistic layered rain -->
  <canvas id="rain-canvas"></canvas>

  <!-- texture & vignette -->
  <div class="grain"></div>
  <div class="vignette"></div>

  <!-- top-left credit (always visible) -->
  <div class="credit" aria-hidden="true">
    <div class="c-line"><span class="c-key">image</span><span class="c-val">背景画像元『gogh』</span></div>
    <div class="c-line"><span class="c-key">work</span><span class="c-val">作品元『天気の子』</span></div>
  </div>

  <!-- title screen -->
  <div class="stage" id="stage">
    <div class="title-wrap" id="titleWrap">
      <div class="t-overline">— invitation —</div>
      <div class="t-row1">第 １ 回　コ ス プ レ イ ベ ン ト</div>
      <div class="t-divider"></div>
      <div class="t-main">『 天 気 の 子 』</div>
      <div class="t-sub">非 公 式</div>
      <div class="t-date">A R A I S H I I  ·  ２０２６</div>
    </div>
  </div>
  <div class="tap-hint" id="tapHint">tap to begin</div>

  <!-- main menu (right side) -->
  <div class="menu" id="menu">
    <div class="mission" data-key="chahan" data-title="３人でチャーハン作り">
      <div class="label">チャーハン</div>
      <div class="teru-frame">
        <span class="teru-string"></span>
        <img class="teru-img" src="teru1.png" alt="" data-fallback="1">
      </div>
    </div>
    <div class="mission" data-key="tenki" data-title="天気探し">
      <div class="label">天　気</div>
      <div class="teru-frame">
        <span class="teru-string"></span>
        <img class="teru-img" src="teru2.png" alt="" data-fallback="2">
      </div>
    </div>
    <div class="mission" data-key="photo" data-title="参考フォト集">
      <div class="label">フォト</div>
      <div class="teru-frame">
        <span class="teru-string"></span>
        <img class="teru-img" src="teru3.png" alt="" data-fallback="3">
      </div>
    </div>
  </div>

  <!-- 本家 trigger (bottom-left) -->
  <div class="honke" id="honkeBtn" role="button" aria-label="本家映像を見る">
    <div class="play-mark"></div>
    <div class="h-text">
      <div class="h-jp">本　家</div>
      <div class="h-en">play official</div>
    </div>
  </div>

  <!-- letterbox bars (must be outside modal so they reach beyond) -->
  <div class="lbar top" id="lbarTop"></div>
  <div class="lbar bot" id="lbarBot"></div>

  <!-- 本家 modal -->
  <div class="honke-modal" id="honkeModal">
    <button class="h-close" id="honkeClose" aria-label="閉じる">×</button>
    <div class="h-overline">— 本 家 映 像 —</div>
    <div class="h-title">『 天 気 の 子 』 予 告</div>
    <div class="h-frame-wrap">
      <div class="h-corners"><span></span><span></span><span></span><span></span></div>
      <iframe id="honkeIframe" class="h-frame" src="" title="本家映像" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <div class="h-meta">© toho · official trailer</div>
  </div>

  <!-- mission destination scene -->
  <div class="scene" id="scene">
    <div class="scene-name" id="sceneName">　</div>
    <div class="scene-mark">— mission —</div>
    <div class="scene-back" id="sceneBack">← back</div>
  </div>

  <!-- hidden YouTube audio host -->
  <div id="yt-audio-host"><div id="yt-audio-player"></div></div>

  <!-- ambient rain.mp3 (plays alongside YouTube audio + click sfx, all independent) -->
  <audio id="rainAudio" loop preload="auto">
    <source src="rain.mp3" type="audio/mpeg">
  </audio>

  <!-- click sfx (rain1.mp3) -->
  <audio id="clickAudio" preload="auto">
    <source src="rain1.mp3" type="audio/mpeg">
  </audio>

<script>
(()=>{
  const State = { LOADING:'loading', TITLE:'title', TRANS:'trans', MENU:'menu', SCENE:'scene' };
  let state = State.LOADING;

  const $ = (id)=>document.getElementById(id);
  const titleWrap = $('titleWrap');
  const tapHint = $('tapHint');
  const menu = $('menu');
  const bgVideo = $('bgVideo');
  const bgFallback = $('bgFallback');
  const rainAudio = $('rainAudio');
  const clickAudio = $('clickAudio');
  const scene = $('scene');
  const sceneName = $('sceneName');
  const sceneBack = $('sceneBack');
  const honkeBtn = $('honkeBtn');
  const honkeModal = $('honkeModal');
  const honkeClose = $('honkeClose');
  const honkeIframe = $('honkeIframe');
  const lbarTop = $('lbarTop');
  const lbarBot = $('lbarBot');

  // ---------- title fade-in ----------
  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      titleWrap.classList.add('in');
      state = State.TITLE;
    }, 700);
  });

  // ---------- teru fallback ----------
  document.querySelectorAll('.teru-img').forEach(img=>{
    img.addEventListener('error', ()=>{
      const i = img.dataset.fallback;
      const wrap = img.parentElement;
      wrap.removeChild(img);
      wrap.insertAdjacentHTML('beforeend', teruSVG(i));
    });
  });

  function teruSVG(variant){
    const eyes = {
      '1':'<path d="M40,46 Q42,49 44,46" stroke="rgba(40,50,65,.7)" fill="none" stroke-width="1.2" stroke-linecap="round"/><path d="M56,46 Q58,49 60,46" stroke="rgba(40,50,65,.7)" fill="none" stroke-width="1.2" stroke-linecap="round"/>',
      '2':'<circle cx="42" cy="47" r="1.2" fill="rgba(40,50,65,.75)"/><circle cx="58" cy="47" r="1.2" fill="rgba(40,50,65,.75)"/><path d="M46,54 Q50,57 54,54" stroke="rgba(40,50,65,.6)" fill="none" stroke-width="1" stroke-linecap="round"/>',
      '3':'<path d="M40,47 L44,47" stroke="rgba(40,50,65,.7)" stroke-width="1.2" stroke-linecap="round"/><path d="M56,47 L60,47" stroke="rgba(40,50,65,.7)" stroke-width="1.2" stroke-linecap="round"/>'
    };
    return `<svg class="teru-img" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <defs>
        <radialGradient id="tg${variant}" cx="50%" cy="35%" r="60%">
          <stop offset="0%" stop-color="rgba(255,255,255,.98)"/>
          <stop offset="60%" stop-color="rgba(232,238,246,.85)"/>
          <stop offset="100%" stop-color="rgba(195,210,228,.55)"/>
        </radialGradient>
      </defs>
      <path d="M50,18 Q22,40 24,92 Q24,128 50,130 Q76,128 76,92 Q78,40 50,18 Z" fill="url(#tg${variant})"/>
      <path d="M28,60 Q50,66 72,60" stroke="rgba(160,175,195,.55)" fill="none" stroke-width="1.2"/>
      ${eyes[variant]}
    </svg>`;
  }

  // hide video element if source fails
  bgVideo.addEventListener('error', ()=>{ bgVideo.style.display = 'none'; });
  const vidSrc = bgVideo.querySelector('source');
  if(vidSrc) vidSrc.addEventListener('error', ()=>{ bgVideo.style.display = 'none'; });

  // ---------- YouTube IFrame API for audio loop ----------
  let ytPlayer = null;
  let ytReady = false;
  const YT_AUDIO_ID = 'YAXTn0E-Zgo';

  (function loadYT(){
    if(window.YT && window.YT.Player){ initYT(); return; }
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();
  window.onYouTubeIframeAPIReady = function(){ initYT(); };

  function initYT(){
    if(ytPlayer) return;
    ytPlayer = new YT.Player('yt-audio-player', {
      height:'1', width:'1',
      videoId: YT_AUDIO_ID,
      playerVars:{
        autoplay:0, controls:0, disablekb:1, fs:0, iv_load_policy:3,
        modestbranding:1, playsinline:1, rel:0,
        loop:1, playlist:YT_AUDIO_ID
      },
      events:{
        'onReady': ()=>{
          ytReady = true;
          try{ ytPlayer.setVolume(0); }catch(e){}
        },
        'onStateChange': (e)=>{
          if(e.data === YT.PlayerState.ENDED){
            try{ ytPlayer.seekTo(0); ytPlayer.playVideo(); }catch(err){}
          }
        }
      }
    });
  }

  function ytFadeVolume(target, duration){
    if(!ytPlayer || !ytReady) return;
    const start = performance.now();
    let from = 0;
    try{ from = ytPlayer.getVolume() || 0; }catch(e){}
    function step(now){
      const t = Math.min(1,(now-start)/duration);
      const e = t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      const v = from + (target - from) * e;
      try{ ytPlayer.setVolume(v); }catch(err){}
      if(t<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // generic fade for HTML <audio> elements (volume 0..1)
  function fadeAudioVolume(audio, target, duration){
    const start = performance.now();
    const from = audio.volume || 0;
    function step(now){
      const t = Math.min(1,(now-start)/duration);
      const e = t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      audio.volume = Math.max(0, Math.min(1, from + (target - from) * e));
      if(t<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- start experience on first tap ----------
  let started = false;
  function start(){
    if(started) return;
    if(state !== State.TITLE) return;
    started = true;
    state = State.TRANS;

    titleWrap.classList.remove('in');
    titleWrap.classList.add('out');
    tapHint.classList.add('out');

    bgVideo.classList.add('show');
    bgFallback.classList.add('show');
    document.getElementById('rain-canvas').classList.add('show');
    rainActive = true;

    // robust video play (muted autoplay, retry a few times)
    bgVideo.muted = true;
    bgVideo.playsInline = true;
    const playV = (n=0)=>{
      if(n>4) return;
      const p = bgVideo.play();
      if(p && p.catch) p.catch(()=>setTimeout(()=>playV(n+1), 600));
    };
    playV();

    // ambient rain.mp3 — plays alongside YouTube audio (each <audio>/iframe is independent)
    try{
      rainAudio.volume = 0;
      const pr = rainAudio.play();
      if(pr && pr.then){
        pr.then(()=>fadeAudioVolume(rainAudio, 0.55, 5000)).catch(()=>{});
      }
    }catch(err){}

    // YouTube audio loop — independent stream, plays simultaneously with rain.mp3
    const tryPlayYT = ()=>{
      if(!ytPlayer || !ytReady){
        setTimeout(tryPlayYT, 300);
        return;
      }
      try{
        ytPlayer.setVolume(0);
        ytPlayer.playVideo();
        setTimeout(()=> ytFadeVolume(55, 5000), 400);
      }catch(err){}
    };
    tryPlayYT();

    setTimeout(()=>{
      menu.classList.add('in');
      honkeBtn.classList.add('in');
      state = State.MENU;
    }, 2200);
  }
  ['click','touchstart','keydown'].forEach(ev=>{
    window.addEventListener(ev, start, {passive:true});
  });

  // ---------- ripple on missions ----------
  document.querySelectorAll('.mission').forEach(m=>{
    m.addEventListener('click', (e)=>{
      if(state !== State.MENU) return;
      e.stopPropagation();
      m.classList.add('firing');

      const frame = m.querySelector('.teru-frame');
      const r1 = makeRipple();
      const r2 = makeRipple('r2');
      const r3 = makeRipple('r3');
      frame.appendChild(r1); frame.appendChild(r2); frame.appendChild(r3);
      setTimeout(()=>{r1.remove();r2.remove();r3.remove();}, 2200);

      try{
        clickAudio.currentTime = 0;
        clickAudio.volume = 0.85;
        clickAudio.play().catch(()=>{});
      }catch(err){}

      const title = m.dataset.title || m.dataset.key;
      setTimeout(()=>openScene(title), 700);
      setTimeout(()=>m.classList.remove('firing'), 900);
    });
  });

  function makeRipple(extraClass){
    const d = document.createElement('div');
    d.className = 'ripple' + (extraClass ? ' '+extraClass : '');
    return d;
  }

  // ---------- mission scene ----------
  function openScene(name){
    state = State.SCENE;
    sceneName.textContent = name;
    scene.classList.add('in');
    menu.style.opacity = '.15';
  }
  sceneBack.addEventListener('click', (e)=>{
    e.stopPropagation();
    scene.classList.remove('in');
    menu.style.opacity = '';
    setTimeout(()=>{ state = State.MENU; }, 800);
  });

  // ---------- 本家 modal ----------
  let savedYTVol = 55;
  honkeBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(state !== State.MENU) return;

    if(ytPlayer && ytReady){
      try{ savedYTVol = ytPlayer.getVolume() || 55; }catch(err){}
      ytFadeVolume(8, 600);
    }

    // letterbox bars in
    lbarTop.classList.add('in');
    lbarBot.classList.add('in');

    const embed = `https://www.youtube.com/embed/VGksHFs04Rc?start=3&autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    honkeIframe.src = embed;
    honkeModal.classList.add('in');
  });
  function closeHonke(){
    honkeModal.classList.remove('in');
    lbarTop.classList.remove('in');
    lbarBot.classList.remove('in');
    setTimeout(()=>{ honkeIframe.src = ''; }, 600);
    if(ytPlayer && ytReady){ ytFadeVolume(savedYTVol, 900); }
  }
  honkeClose.addEventListener('click', (e)=>{ e.stopPropagation(); closeHonke(); });
  honkeModal.addEventListener('click', (e)=>{
    if(e.target === honkeModal) closeHonke();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && honkeModal.classList.contains('in')) closeHonke();
  });

  // ---------- subtle layered rain (atmospheric, doesn't fight the video) ----------
  const canvas = document.getElementById('rain-canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let rainActive = false;
  let drops = [];

  // three layers: far → near. Lighter density + lower opacity than before.
  const LAYERS = [
    { share:.30, sMin: 9,  sMax: 15, lMin: 5,  lMax: 13, oMin:.05, oMax:.12, wMin:.5, wMax:.7, slMin:-.4, slMax:-.9 },
    { share:.40, sMin: 20, sMax: 34, lMin: 14, lMax: 30, oMin:.10, oMax:.22, wMin:.6, wMax:.9, slMin:-.7, slMax:-1.4 },
    { share:.30, sMin: 42, sMax: 80, lMin: 30, lMax: 70, oMin:.22, oMax:.45, wMin:.9, wMax:1.3, slMin:-1.0, slMax:-2.0 },
  ];

  function rand(a,b){ return a + Math.random()*(b-a); }

  function makeDrop(layer){
    return {
      x: Math.random()*W,
      y: Math.random()*H - H,
      len: rand(layer.lMin, layer.lMax),
      speed: rand(layer.sMin, layer.sMax),
      opacity: rand(layer.oMin, layer.oMax),
      width: rand(layer.wMin, layer.wMax),
      slant: rand(layer.slMin, layer.slMax),
      layer
    };
  }

  function initDrops(){
    drops = [];
    const area = W*H;
    // density: significantly thinner than before so the bg video stays visible
    const baseCount = Math.min(420, Math.max(150, Math.floor(area/4800)));
    LAYERS.forEach(layer=>{
      const n = Math.floor(baseCount * layer.share);
      for(let i=0;i<n;i++) drops.push(makeDrop(layer));
    });
  }

  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
    initDrops();
  }

  function tick(){
    if(!rainActive){ requestAnimationFrame(tick); return; }

    // clear faster (bigger fade alpha) so streaks read as crisp flashes, not thick smears
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(0,0,W,H);

    ctx.lineCap = 'round';

    for(let i=0;i<drops.length;i++){
      const d = drops[i];
      ctx.lineWidth = d.width;
      ctx.strokeStyle = `rgba(220,235,255,${d.opacity})`;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.slant, d.y + d.len);
      ctx.stroke();

      d.x += d.slant * .35;
      d.y += d.speed;

      if(d.y > H){
        d.y = -d.len - rand(0, 100);
        d.x = Math.random()*W;
        d.len = rand(d.layer.lMin, d.layer.lMax);
        d.speed = rand(d.layer.sMin, d.layer.sMax);
        d.opacity = rand(d.layer.oMin, d.layer.oMax);
        d.slant = rand(d.layer.slMin, d.layer.slMax);
      }
    }

    requestAnimationFrame(tick);
  }

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });
  resize();
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
